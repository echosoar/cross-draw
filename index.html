<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cross Draw</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #fff; color: #000; }
    button, input { font: inherit; }
    .app { width: min(1440px, calc(100% - 80px)); margin: 0 auto; padding: 52px 0 40px; }
    .masthead { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding-bottom: 34px; }
    .eyebrow { margin: 0 0 10px; color: rgba(0, 0, 0, .48); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 64px); font-weight: 500; letter-spacing: -.065em; line-height: .94; }
    .masthead-note { max-width: 260px; margin: 0 0 3px; color: rgba(0, 0, 0, .52); font-size: 13px; line-height: 1.55; }
    .workspace { border-top: 1px solid rgba(0, 0, 0, .88); }
    .toolbar { display: flex; align-items: center; gap: 4px; min-height: 74px; padding: 16px 0; border-bottom: 1px solid rgba(0, 0, 0, .16); }
    .tool, .clear, .delete, .preview, .export { appearance: none; min-height: 36px; border: 0; background: transparent; color: #000; cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .02em; display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    .tool { width: 38px; padding: 0; color: rgba(0, 0, 0, .42); }
    .tool.active { color: #000; background: #000; color: #fff; }
    .tool svg { width: 18px; height: 18px; overflow: visible; }
    .divider { width: 1px; height: 20px; background: rgba(0, 0, 0, .18); margin: 0 14px; }
    .color-control { display: flex; align-items: center; gap: 9px; color: rgba(0, 0, 0, .58); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
    #colorPicker { width: 28px; height: 28px; border: 1px solid rgba(0, 0, 0, .65); padding: 2px; background: #fff; cursor: pointer; }
    #colorValue { min-width: 68px; color: rgba(0, 0, 0, .58); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 500; }
    .recent-colors { display: flex; align-items: center; gap: 5px; margin-left: 2px; }
    .recent-color { width: 18px; height: 18px; border: 1px solid rgba(0, 0, 0, .42); padding: 0; cursor: pointer; }
    .recent-color:disabled { opacity: .24; cursor: not-allowed; }
    .delete, .clear { margin-left: 8px; padding: 0 2px; color: rgba(0, 0, 0, .58); }
    #colorPicker:disabled, .clear:disabled, .delete:disabled { opacity: .24; cursor: not-allowed; }
    .shape.selected-shape { stroke: #000; stroke-width: 2; stroke-dasharray: 5 4; }
    .shape.line-shape { stroke-width: 1; }
    .shape.line-shape.selected-shape { stroke-width: 2; }
    .preview { margin-left: auto; min-height: 36px; padding: 0 6px; color: rgba(0, 0, 0, .58); }
    .export { margin-left: 0; min-height: 36px; padding: 0 14px; background: #000; color: #fff; }
    .drawing-layout { display: grid; grid-template-columns: minmax(0, 1fr) 224px; gap: 40px; align-items: start; padding-top: 30px; }
    .canvas-column { min-width: 0; }
    .board-shell { overflow: hidden; background: #fff; }
    #board { display: block; width: 100%; aspect-ratio: 11 / 7; background: #fff; touch-action: none; user-select: none; }
    .properties { min-height: 278px; padding-top: 2px; }
    .properties[hidden] { display: none; }
    .properties-title { margin: 0 0 21px; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .property-form { display: grid; gap: 14px; }
    .property-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: center; }
    .property-row label { color: rgba(0, 0, 0, .52); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .property-row input { width: 100%; min-width: 0; border: 0; border-bottom: 1px solid rgba(0, 0, 0, .2); padding: 5px 0 6px; background: transparent; color: #000; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; outline-offset: 2px; }
    .property-row input:focus { border-bottom-color: #000; }
    .property-divider { height: 1px; margin: 6px 0 1px; background: rgba(0, 0, 0, .14); }
    .aspect-toggle { width: 100%; min-height: 34px; border: 1px solid rgba(0, 0, 0, .42); padding: 0 9px; background: transparent; color: #000; cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-align: left; }
    .copy-shape, .remove-shape { width: 100%; min-height: 34px; margin-top: 8px; border: 0; padding: 0; background: transparent; color: rgba(0, 0, 0, .58); cursor: pointer; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-align: left; }
    .copy-shape:disabled, .remove-shape:disabled { opacity: .24; cursor: not-allowed; }
    .aspect-toggle[aria-pressed="true"]::before { content: "锁定比例"; }
    .aspect-toggle[aria-pressed="false"]::before { content: "解锁比例"; }
    .aspect-toggle span { color: rgba(0, 0, 0, .45); font-weight: 500; }
    .properties-empty { margin: 0; color: rgba(0, 0, 0, .42); font-size: 12px; line-height: 1.65; }
    .properties-empty[hidden] { display: none; }
    #regionLayer path { cursor: pointer; }
    #shapeLayer { pointer-events: none; }
    .shape { fill: none; stroke: #000; stroke-width: 2; vector-effect: non-scaling-stroke; }
    #preview { fill: none; stroke: rgba(0, 0, 0, .38); stroke-width: 1; stroke-dasharray: 4 4; pointer-events: none; vector-effect: non-scaling-stroke; }
    #selection { fill: none; stroke: #000; stroke-width: 1.5; stroke-dasharray: 5 4; pointer-events: none; vector-effect: non-scaling-stroke; }
    .line-handle { fill: #fff; stroke: #000; stroke-width: 1.5; cursor: grab; vector-effect: non-scaling-stroke; }
    #shapeRotateHandle { fill: #b9e6ff; stroke: #5a9ec7; }
    #shapeResizeHandle { cursor: nwse-resize; }
    /* SVG 的 hidden 属性在部分渲染环境不会移除已绘制的 path；用 display 强制同步。 */
    #preview[hidden], #selection[hidden], .line-handle[hidden] { display: none !important; }
    .help { max-width: 720px; margin: 22px 0 0; color: rgba(0, 0, 0, .48); font-size: 12px; line-height: 1.7; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    button:focus-visible, input:focus-visible { outline: 1px solid #000; outline-offset: 3px; }
    @media (max-width: 900px) { .drawing-layout { grid-template-columns: 1fr; gap: 28px; } .properties { min-height: 0; width: min(100%, 360px); border-top: 1px solid rgba(0, 0, 0, .16); padding-top: 20px; } }
    @media (max-width: 720px) { .app { width: calc(100% - 32px); padding: 30px 0; } .masthead { align-items: start; flex-direction: column; gap: 18px; padding-bottom: 28px; } .masthead-note { max-width: 310px; } .toolbar { flex-wrap: wrap; gap: 5px; padding: 12px 0; } .divider { margin: 0 7px; } .preview, .export { margin-left: 0; } .color-control { margin-right: 10px; } .delete, .clear { margin-left: 2px; } .drawing-layout { padding-top: 22px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="masthead">
      <div>
        <p class="eyebrow">Geometric drawing surface</p>
        <h1>Cross Draw.</h1>
      </div>
      <p class="masthead-note">用交叠的圆与方形构成区域，并以黑色的不同透明度记录每一个选择。</p>
    </header>
    <section class="workspace" aria-label="绘图工作区">
    <div class="toolbar" role="toolbar" aria-label="画板工具">
      <button class="tool active" type="button" data-mode="select" aria-label="选择工具" title="选择 / 移动">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 18.3 11l-6.2 1.8L9.7 19 5 3.5Z" fill="currentColor" stroke="currentColor" stroke-linejoin="round"/><path d="m13 14 5.2 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="tool" type="button" data-mode="square" aria-label="绘制方形" title="绘制方形">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button class="tool" type="button" data-mode="circle" aria-label="绘制圆形" title="绘制圆形">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button class="tool" type="button" data-mode="line" aria-label="绘制直线" title="绘制直线">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18 19 6" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="5" cy="18" r="1.25" fill="currentColor"/><circle cx="19" cy="6" r="1.25" fill="currentColor"/></svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <label class="color-control" for="colorPicker">颜色 <input id="colorPicker" type="color" value="#000000" disabled><output id="colorValue" aria-live="polite">透明</output></label>
      <div class="recent-colors" id="recentColors" role="group" aria-label="最近使用的颜色"></div>
      <button class="delete" id="deleteShape" type="button" disabled>移除图形</button>
      <button class="clear" id="clearColor" type="button" disabled>透明</button>
      <button class="preview" id="previewBaseOutlines" type="button" aria-pressed="false">预览</button>
      <button class="export" id="exportSvg" type="button">导出已上色 SVG</button>
    </div>
    <div class="drawing-layout">
      <div class="canvas-column">
        <div class="board-shell">
          <svg id="board" viewBox="0 0 1100 700" role="application" tabindex="0" aria-label="白色画板：拖动创建图形，选择工具可移动边框或选中区域">
            <g id="regionLayer"></g>
            <g id="shapeLayer"></g>
            <g id="overlayLayer"><path id="preview" hidden></path><path id="selection" hidden></path><circle id="lineStartHandle" class="line-handle" data-line-handle="a" r="5" hidden></circle><circle id="lineEndHandle" class="line-handle" data-line-handle="b" r="5" hidden></circle><circle id="shapeRotateHandle" class="line-handle" data-shape-rotate r="5" hidden></circle><circle id="shapeResizeHandle" class="line-handle shape-resize-handle" data-shape-resize r="5" hidden></circle></g>
          </svg>
        </div>
        <p class="help">选择工具：点击图形边框可选中，拖动边框或其周围 5px 可移动图形。方形、圆形或直线工具：在画板上拖动即可创建图形。</p>
        <p class="help">Created by <a href="https://x.com/intent/user?screen_name=codersoar" target="_blank">soar</a>.</p>
      </div>
      <aside class="properties" id="propertiesPanel" tabindex="0" aria-label="图形属性" hidden>
        <h2 class="properties-title">图形属性</h2>
        <div class="property-form">
          <div class="property-row"><label id="shapeXLabel" for="shapeX">X</label><input id="shapeX" type="number" inputmode="decimal" step="1" aria-label="左上角 X 坐标"></div>
          <div class="property-row"><label id="shapeYLabel" for="shapeY">Y</label><input id="shapeY" type="number" inputmode="decimal" step="1" aria-label="左上角 Y 坐标"></div>
          <div class="property-divider" aria-hidden="true"></div>
          <div class="property-row"><label id="shapeWidthLabel" for="shapeWidth">W</label><input id="shapeWidth" type="number" inputmode="decimal" min="3" step="1" aria-label="宽度"></div>
          <div class="property-row"><label id="shapeHeightLabel" for="shapeHeight">H</label><input id="shapeHeight" type="number" inputmode="decimal" min="3" step="1" aria-label="高度"></div>
          <div class="property-row" id="lineAngleRow" hidden><label for="lineAngle">°</label><input id="lineAngle" type="number" inputmode="decimal" step="1" aria-label="顺时针角度"></div>
          <button class="aspect-toggle" id="aspectToggle" type="button" aria-pressed="true"><span> · 点击切换</span></button>
          <button class="copy-shape" id="copyShape" type="button">复制</button>
          <button class="remove-shape" id="removeShape" type="button">移除图形</button>
        </div>
      </aside>
    </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const WIDTH = 1100;
      const HEIGHT = 700;
      const EPS = 1e-7;
      const NODE_PRECISION = 10000;
      const board = document.getElementById('board');
      const regionLayer = document.getElementById('regionLayer');
      const shapeLayer = document.getElementById('shapeLayer');
      const preview = document.getElementById('preview');
      const selection = document.getElementById('selection');
      const lineStartHandle = document.getElementById('lineStartHandle');
      const lineEndHandle = document.getElementById('lineEndHandle');
      const shapeRotateHandle = document.getElementById('shapeRotateHandle');
      const shapeResizeHandle = document.getElementById('shapeResizeHandle');
      const colorPicker = document.getElementById('colorPicker');
      const colorValue = document.getElementById('colorValue');
      const recentColorsContainer = document.getElementById('recentColors');
      const clearColorButton = document.getElementById('clearColor');
      const deleteShapeButton = document.getElementById('deleteShape');
      const previewButton = document.getElementById('previewBaseOutlines');
      const exportButton = document.getElementById('exportSvg');
      const propertiesPanel = document.getElementById('propertiesPanel');
      const shapeXLabel = document.getElementById('shapeXLabel');
      const shapeYLabel = document.getElementById('shapeYLabel');
      const shapeWidthLabel = document.getElementById('shapeWidthLabel');
      const shapeHeightLabel = document.getElementById('shapeHeightLabel');
      const shapeXInput = document.getElementById('shapeX');
      const shapeYInput = document.getElementById('shapeY');
      const shapeWidthInput = document.getElementById('shapeWidth');
      const shapeHeightInput = document.getElementById('shapeHeight');
      const lineAngleRow = document.getElementById('lineAngleRow');
      const lineAngleInput = document.getElementById('lineAngle');
      const aspectToggle = document.getElementById('aspectToggle');
      const copyShapeButton = document.getElementById('copyShape');
      const removeShapeButton = document.getElementById('removeShape');

      let mode = 'select';
      let shapes = [];
      let regions = [];
      let selectedRegionKey = null;
      let selectedShapeId = null;
      let draftShape = null;
      let pointerAction = null;
      let recentColors = ['#000000', '#ff0000', '#0000ff'];
      let colorPickerSessionOpen = false;
      let colorPickerSessionChanged = false;
      let colorPickerSessionStartColor = null;
      let hideBaseShapeOutlines = false;
      let hideColoredRegions = false;
      let copiedShape = null;
      let nextShapeId = 1;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const point = (x, y) => ({ x, y });
      const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
      const keyForPoint = (p) => `${Math.round(p.x * NODE_PRECISION)},${Math.round(p.y * NODE_PRECISION)}`;
      const fmt = (value) => Number(value.toFixed(3)).toString();
      const integer = (value) => Math.round(value);
      const integerText = (value) => String(integer(value));
      const normalizeAngle = (angle) => ((angle % 360) + 360) % 360;
      const lineAngle = (shape) => normalizeAngle(Math.atan2(shape.by - shape.ay, shape.bx - shape.ax) * 180 / Math.PI);
      const rotationOf = (shape) => normalizeAngle(shape.rotation || 0);
      const rotationRadians = (shape) => rotationOf(shape) * Math.PI / 180;
      const pointText = (p) => `${fmt(p.x)} ${fmt(p.y)}`;
      const createSvg = (name) => document.createElementNS(SVG_NS, name);

      function pointerPosition(event) {
        const rect = board.getBoundingClientRect();
        return point(
          integer(clamp((event.clientX - rect.left) * WIDTH / rect.width, 0, WIDTH)),
          integer(clamp((event.clientY - rect.top) * HEIGHT / rect.height, 0, HEIGHT))
        );
      }

      function setOverlayVisibility(element, visible) {
        element.toggleAttribute('hidden', !visible);
        element.style.display = visible ? '' : 'none';
      }

      function hidePreview() { setOverlayVisibility(preview, false); }
      function showPreview() { setOverlayVisibility(preview, true); }
      function hideSelection() { setOverlayVisibility(selection, false); }
      function showSelection() { setOverlayVisibility(selection, true); }

      function updateBoardCursor() {
        if (pointerAction && (pointerAction.kind === 'move' || pointerAction.kind === 'line-endpoint' || pointerAction.kind === 'shape-resize' || pointerAction.kind === 'shape-rotate')) board.style.cursor = 'grabbing';
        else board.style.cursor = mode === 'select' ? 'default' : 'crosshair';
      }

      function setMode(nextMode) {
        mode = nextMode;
        document.querySelectorAll('.tool').forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
        hidePreview();
        draftShape = null;
        clearSelection();
        clearShapeSelection();
        updatePropertiesPanel();
        updateBoardCursor();
      }

      document.querySelectorAll('.tool').forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));

      function shapeFrame(shape) {
        if (shape.type === 'line') {
          const left = Math.min(shape.ax, shape.bx);
          const top = Math.min(shape.ay, shape.by);
          return { left, top, width: Math.abs(shape.bx - shape.ax), height: Math.abs(shape.by - shape.ay), cx: (shape.ax + shape.bx) / 2, cy: (shape.ay + shape.by) / 2 };
        }
        return shape.type === 'square'
          ? { left: shape.x, top: shape.y, width: shape.width, height: shape.height, cx: shape.x + shape.width / 2, cy: shape.y + shape.height / 2 }
          : { left: shape.cx - shape.rx, top: shape.cy - shape.ry, width: shape.rx * 2, height: shape.ry * 2, cx: shape.cx, cy: shape.cy };
      }

      function rotateVector(vector, radians) {
        const cosine = Math.cos(radians);
        const sine = Math.sin(radians);
        return point(cosine * vector.x - sine * vector.y, sine * vector.x + cosine * vector.y);
      }

      function pointFromLocal(shape, local) {
        const frame = shapeFrame(shape);
        const vector = rotateVector(local, rotationRadians(shape));
        return point(frame.cx + vector.x, frame.cy + vector.y);
      }

      function pointToLocal(shape, world) {
        const frame = shapeFrame(shape);
        return rotateVector(point(world.x - frame.cx, world.y - frame.cy), -rotationRadians(shape));
      }

      function shapeBounds(shape) {
        if (shape.type === 'line') {
          const left = Math.min(shape.ax, shape.bx);
          const top = Math.min(shape.ay, shape.by);
          return { left, top, right: Math.max(shape.ax, shape.bx), bottom: Math.max(shape.ay, shape.by), width: Math.abs(shape.bx - shape.ax), height: Math.abs(shape.by - shape.ay) };
        }
        const frame = shapeFrame(shape);
        const radians = rotationRadians(shape);
        const halfWidth = frame.width / 2;
        const halfHeight = frame.height / 2;
        const extentX = shape.type === 'square'
          ? Math.abs(Math.cos(radians)) * halfWidth + Math.abs(Math.sin(radians)) * halfHeight
          : Math.hypot(shape.rx * Math.cos(radians), shape.ry * Math.sin(radians));
        const extentY = shape.type === 'square'
          ? Math.abs(Math.sin(radians)) * halfWidth + Math.abs(Math.cos(radians)) * halfHeight
          : Math.hypot(shape.rx * Math.sin(radians), shape.ry * Math.cos(radians));
        return { left: frame.cx - extentX, top: frame.cy - extentY, right: frame.cx + extentX, bottom: frame.cy + extentY, width: extentX * 2, height: extentY * 2 };
      }

      function copyShape(shape) { return { ...shape }; }

      function isBasicShape(shape) { return Boolean(shape) && ['square', 'circle', 'line'].includes(shape.type); }

      function addDuplicateShape(source) {
        if (!isBasicShape(source)) return null;
        const duplicate = copyShape(source);
        duplicate.id = `shape-${nextShapeId}`;
        if (duplicate.type === 'line') {
          duplicate.ax += 10;
          duplicate.ay += 10;
          duplicate.bx += 10;
          duplicate.by += 10;
        } else if (duplicate.type === 'square') {
          duplicate.x += 10;
          duplicate.y += 10;
        } else {
          duplicate.cx += 10;
          duplicate.cy += 10;
        }
        shapes.push(duplicate);
        selectedShapeId = duplicate.id;
        nextShapeId += 1;
        clearSelection();
        calculateRegions();
        return duplicate;
      }

      function duplicateSelectedShape() { return addDuplicateShape(selectedShape()); }

      function copySelectedShapeToBuffer() {
        const shape = selectedShape();
        if (!isBasicShape(shape)) return false;
        copiedShape = copyShape(shape);
        return true;
      }

      function pasteCopiedShape() { return Boolean(addDuplicateShape(copiedShape)); }

      function clampShapeToBoard(shape) {
        if (shape.type === 'line') {
          shape.ax = integer(clamp(shape.ax, 0, WIDTH));
          shape.ay = integer(clamp(shape.ay, 0, HEIGHT));
          shape.bx = integer(clamp(shape.bx, 0, WIDTH));
          shape.by = integer(clamp(shape.by, 0, HEIGHT));
          return;
        }
        const bounds = shapeBounds(shape);
        const dx = clamp(0, -bounds.left, WIDTH - bounds.right);
        const dy = clamp(0, -bounds.top, HEIGHT - bounds.bottom);
        if (shape.type === 'square') { shape.x += dx; shape.y += dy; }
        else { shape.cx += dx; shape.cy += dy; }
      }

      function setShapeBounds(shape, nextBounds, changedDimension = null) {
        const current = shapeFrame(shape);
        let left = Number.isFinite(nextBounds.left) ? integer(nextBounds.left) : integer(current.left);
        let top = Number.isFinite(nextBounds.top) ? integer(nextBounds.top) : integer(current.top);
        let width = Number.isFinite(nextBounds.width) ? Math.max(3, integer(nextBounds.width)) : integer(current.width);
        let height = Number.isFinite(nextBounds.height) ? Math.max(3, integer(nextBounds.height)) : integer(current.height);
        const locked = shape.aspectLocked !== false;
        const ratio = current.width / current.height || 1;
        if (locked && changedDimension === 'width') height = width / ratio;
        if (locked && changedDimension === 'height') width = height * ratio;
        if (locked && changedDimension) {
          if (changedDimension === 'width') height = width / ratio;
          else width = height * ratio;
        }
        left = integer(left);
        top = integer(top);
        width = integer(width);
        height = integer(height);
        if (shape.type === 'square') Object.assign(shape, { x: left, y: top, width, height });
        else Object.assign(shape, { cx: left + width / 2, cy: top + height / 2, rx: width / 2, ry: height / 2 });
        clampShapeToBoard(shape);
      }

      function makeShapeFromDrag(type, start, current) {
        if (type === 'line') {
          if (distance(start, current) < 3) return null;
          return { id: `shape-${nextShapeId}`, type, ax: start.x, ay: start.y, bx: current.x, by: current.y };
        }
        const dx = current.x - start.x;
        const dy = current.y - start.y;
        const directionX = dx >= 0 ? 1 : -1;
        const directionY = dy >= 0 ? 1 : -1;
        const requested = Math.min(Math.abs(dx), Math.abs(dy));
        const maxX = directionX > 0 ? WIDTH - start.x : start.x;
        const maxY = directionY > 0 ? HEIGHT - start.y : start.y;
        const size = Math.min(requested, maxX, maxY);
        if (size < 3) return null;
        const left = directionX > 0 ? start.x : start.x - size;
        const top = directionY > 0 ? start.y : start.y - size;
        if (type === 'square') return { id: `shape-${nextShapeId}`, type, x: left, y: top, width: size, height: size, rotation: 0, aspectLocked: true };
        return { id: `shape-${nextShapeId}`, type, cx: left + size / 2, cy: top + size / 2, rx: size / 2, ry: size / 2, rotation: 0, aspectLocked: true };
      }

      function previewDrag(start, current) {
        const draft = makeShapeFromDrag(mode, start, current);
        if (!draft) { hidePreview(); updatePropertiesPanel(); return; }
        draftShape = draft;
        showPreview();
        if (draft.type === 'line') preview.setAttribute('d', `M ${fmt(draft.ax)} ${fmt(draft.ay)} L ${fmt(draft.bx)} ${fmt(draft.by)}`);
        else if (draft.type === 'square') preview.setAttribute('d', `M ${fmt(draft.x)} ${fmt(draft.y)} h ${fmt(draft.width)} v ${fmt(draft.height)} h ${fmt(-draft.width)} Z`);
        else preview.setAttribute('d', `M ${fmt(draft.cx - draft.rx)} ${fmt(draft.cy)} A ${fmt(draft.rx)} ${fmt(draft.ry)} 0 1 0 ${fmt(draft.cx + draft.rx)} ${fmt(draft.cy)} A ${fmt(draft.rx)} ${fmt(draft.ry)} 0 1 0 ${fmt(draft.cx - draft.rx)} ${fmt(draft.cy)}`);
        updatePropertiesPanel();
      }

      function distanceToSegment(p, a, b) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const lengthSquared = dx * dx + dy * dy;
        if (lengthSquared < EPS) return distance(p, a);
        const t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / lengthSquared, 0, 1);
        return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
      }

      function distanceToShapeBorder(p, shape) {
        if (shape.type === 'line') return distanceToSegment(p, point(shape.ax, shape.ay), point(shape.bx, shape.by));
        const local = pointToLocal(shape, p);
        const frame = shapeFrame(shape);
        if (shape.type === 'circle') {
          const segments = 96;
          let nearest = Infinity;
          let previous = point(shape.rx, 0);
          for (let i = 1; i <= segments; i += 1) {
            const theta = Math.PI * 2 * i / segments;
            const current = point(shape.rx * Math.cos(theta), shape.ry * Math.sin(theta));
            nearest = Math.min(nearest, distanceToSegment(local, previous, current));
            previous = current;
          }
          return nearest;
        }
        const halfWidth = frame.width / 2;
        const halfHeight = frame.height / 2;
        const a = point(-halfWidth, -halfHeight);
        const b = point(halfWidth, -halfHeight);
        const c = point(halfWidth, halfHeight);
        const d = point(-halfWidth, halfHeight);
        return Math.min(distanceToSegment(local, a, b), distanceToSegment(local, b, c), distanceToSegment(local, c, d), distanceToSegment(local, d, a));
      }

      function closestBorderShape(p) {
        const renderedWidth = board.getBoundingClientRect().width || WIDTH;
        const tolerance = 5 * WIDTH / renderedWidth;
        for (let index = shapes.length - 1; index >= 0; index -= 1) {
          const shape = shapes[index];
          const d = distanceToShapeBorder(p, shape);
          if (d <= tolerance) return { shape, index, distance: d };
        }
        return null;
      }

      function sameBoundary(first, second) {
        if (first.type !== second.type) return false;
        if (first.type === 'line') {
          const sameDirection = Math.abs(first.ax - second.ax) < EPS && Math.abs(first.ay - second.ay) < EPS && Math.abs(first.bx - second.bx) < EPS && Math.abs(first.by - second.by) < EPS;
          const reverseDirection = Math.abs(first.ax - second.bx) < EPS && Math.abs(first.ay - second.by) < EPS && Math.abs(first.bx - second.ax) < EPS && Math.abs(first.by - second.ay) < EPS;
          return sameDirection || reverseDirection;
        }
        const rotationDifference = Math.abs(normalizeAngle(rotationOf(first) - rotationOf(second)));
        if (first.type === 'square') return Math.abs(first.x - second.x) < EPS && Math.abs(first.y - second.y) < EPS && Math.abs(first.width - second.width) < EPS && Math.abs(first.height - second.height) < EPS && (rotationDifference < EPS || Math.abs(rotationDifference - 360) < EPS);
        const isCircle = Math.abs(first.rx - first.ry) < EPS && Math.abs(second.rx - second.ry) < EPS;
        return Math.abs(first.cx - second.cx) < EPS && Math.abs(first.cy - second.cy) < EPS && Math.abs(first.rx - second.rx) < EPS && Math.abs(first.ry - second.ry) < EPS && (isCircle || rotationDifference < EPS || Math.abs(rotationDifference - 360) < EPS);
      }

      function ellipsePoint(ellipse, theta) {
        const offset = rotateVector(point(ellipse.rx * Math.cos(theta), ellipse.ry * Math.sin(theta)), ellipse.rotation);
        return point(ellipse.c.x + offset.x, ellipse.c.y + offset.y);
      }

      function ellipseImplicit(ellipse, p) {
        const local = rotateVector(point(p.x - ellipse.c.x, p.y - ellipse.c.y), -ellipse.rotation);
        return local.x * local.x / (ellipse.rx * ellipse.rx) + local.y * local.y / (ellipse.ry * ellipse.ry) - 1;
      }

      function primitivesForShapes() {
        const primitives = [];
        const uniqueShapes = shapes.filter((shape, index) => !shapes.slice(0, index).some((other) => sameBoundary(shape, other)));
        uniqueShapes.forEach((shape) => {
          if (shape.type === 'line') {
            primitives.push({ id: `${shape.id}-line`, shapeId: shape.id, type: 'line', a: point(shape.ax, shape.ay), b: point(shape.bx, shape.by), params: [0, 1] });
          } else if (shape.type === 'square') {
            const frame = shapeFrame(shape);
            const halfWidth = frame.width / 2;
            const halfHeight = frame.height / 2;
            const corners = [point(-halfWidth, -halfHeight), point(halfWidth, -halfHeight), point(halfWidth, halfHeight), point(-halfWidth, halfHeight)].map((corner) => pointFromLocal(shape, corner));
            for (let i = 0; i < 4; i += 1) primitives.push({ id: `${shape.id}-edge-${i}`, shapeId: shape.id, type: 'line', a: corners[i], b: corners[(i + 1) % 4], params: [0, 1] });
          } else {
            const sequence = Number(shape.id.replace('shape-', '')) || 1;
            const start = ((sequence * 0.61803398875) % 1) * Math.PI * 2;
            primitives.push({ id: `${shape.id}-ellipse`, shapeId: shape.id, type: 'ellipse', c: point(shape.cx, shape.cy), rx: shape.rx, ry: shape.ry, rotation: rotationRadians(shape), rangeStart: start, rangeEnd: start + Math.PI * 2, params: [start, start + Math.PI, start + Math.PI * 2] });
          }
        });
        return primitives;
      }

      function lineLineIntersections(first, second) {
        const r = point(first.b.x - first.a.x, first.b.y - first.a.y);
        const s = point(second.b.x - second.a.x, second.b.y - second.a.y);
        const cross = r.x * s.y - r.y * s.x;
        if (Math.abs(cross) < EPS) return [];
        const qp = point(second.a.x - first.a.x, second.a.y - first.a.y);
        const t = (qp.x * s.y - qp.y * s.x) / cross;
        const u = (qp.x * r.y - qp.y * r.x) / cross;
        if (t < -EPS || t > 1 + EPS || u < -EPS || u > 1 + EPS) return [];
        return [point(first.a.x + clamp(t, 0, 1) * r.x, first.a.y + clamp(t, 0, 1) * r.y)];
      }

      function pointOnSegment(p, line) {
        const dx = line.b.x - line.a.x;
        const dy = line.b.y - line.a.y;
        const cross = (p.x - line.a.x) * dy - (p.y - line.a.y) * dx;
        if (Math.abs(cross) > EPS) return false;
        return p.x >= Math.min(line.a.x, line.b.x) - EPS && p.x <= Math.max(line.a.x, line.b.x) + EPS && p.y >= Math.min(line.a.y, line.b.y) - EPS && p.y <= Math.max(line.a.y, line.b.y) + EPS;
      }

      function splitCollinearOverlap(first, second) {
        const firstDx = first.b.x - first.a.x;
        const firstDy = first.b.y - first.a.y;
        const cross = firstDx * (second.b.y - second.a.y) - firstDy * (second.b.x - second.a.x);
        const aligned = (second.a.x - first.a.x) * firstDy - (second.a.y - first.a.y) * firstDx;
        if (Math.abs(cross) > EPS || Math.abs(aligned) > EPS) return;
        [first.a, first.b].forEach((p) => { if (pointOnSegment(p, second)) addParam(second, p); });
        [second.a, second.b].forEach((p) => { if (pointOnSegment(p, first)) addParam(first, p); });
      }

      function lineEllipseIntersections(line, ellipse) {
        const direction = point(line.b.x - line.a.x, line.b.y - line.a.y);
        const offset = rotateVector(point(line.a.x - ellipse.c.x, line.a.y - ellipse.c.y), -ellipse.rotation);
        const localDirection = rotateVector(direction, -ellipse.rotation);
        const a = localDirection.x * localDirection.x / (ellipse.rx * ellipse.rx) + localDirection.y * localDirection.y / (ellipse.ry * ellipse.ry);
        const b = 2 * (offset.x * localDirection.x / (ellipse.rx * ellipse.rx) + offset.y * localDirection.y / (ellipse.ry * ellipse.ry));
        const c = offset.x * offset.x / (ellipse.rx * ellipse.rx) + offset.y * offset.y / (ellipse.ry * ellipse.ry) - 1;
        const discriminant = b * b - 4 * a * c;
        if (discriminant < -EPS) return [];
        const root = Math.sqrt(Math.max(0, discriminant));
        const candidates = [(-b - root) / (2 * a), (-b + root) / (2 * a)];
        const result = [];
        candidates.forEach((t) => {
          if (t >= -EPS && t <= 1 + EPS) {
            const p = point(line.a.x + clamp(t, 0, 1) * direction.x, line.a.y + clamp(t, 0, 1) * direction.y);
            if (!result.some((other) => distance(p, other) < 1e-5)) result.push(p);
          }
        });
        return result;
      }

      function ellipseEllipseIntersections(first, second) {
        const valueAt = (theta) => ellipseImplicit(second, ellipsePoint(first, theta));
        const intersections = [];
        const slices = 1440;
        let previousTheta = 0;
        let previousValue = valueAt(previousTheta);
        for (let i = 1; i <= slices; i += 1) {
          const theta = Math.PI * 2 * i / slices;
          const value = valueAt(theta);
          if (previousValue * value < 0) {
            let low = previousTheta;
            let high = theta;
            for (let step = 0; step < 40; step += 1) {
              const middle = (low + high) / 2;
              if (valueAt(low) * valueAt(middle) <= 0) high = middle;
              else low = middle;
            }
            const p = ellipsePoint(first, (low + high) / 2);
            if (!intersections.some((other) => distance(p, other) < 1e-4)) intersections.push(p);
          }
          previousTheta = theta;
          previousValue = value;
        }
        return intersections;
      }

      function parameterAt(primitive, p) {
        if (primitive.type === 'line') {
          const dx = primitive.b.x - primitive.a.x;
          const dy = primitive.b.y - primitive.a.y;
          const denominator = dx * dx + dy * dy;
          return clamp(((p.x - primitive.a.x) * dx + (p.y - primitive.a.y) * dy) / denominator, 0, 1);
        }
        const local = rotateVector(point(p.x - primitive.c.x, p.y - primitive.c.y), -primitive.rotation);
        let theta = Math.atan2(local.y / primitive.ry, local.x / primitive.rx);
        if (theta < 0) theta += Math.PI * 2;
        while (theta < primitive.rangeStart - EPS) theta += Math.PI * 2;
        return theta;
      }

      function addParam(primitive, p) {
        const param = parameterAt(primitive, p);
        if (!primitive.params.some((existing) => Math.abs(existing - param) < 1e-6 || (primitive.type === 'ellipse' && Math.abs(Math.abs(existing - param) - Math.PI * 2) < 1e-6))) primitive.params.push(param);
      }

      function pointAt(primitive, parameter) {
        if (primitive.type === 'line') return point(primitive.a.x + (primitive.b.x - primitive.a.x) * parameter, primitive.a.y + (primitive.b.y - primitive.a.y) * parameter);
        return ellipsePoint(primitive, parameter);
      }

      function tangentVector(primitive, parameter, direction = 1) {
        if (primitive.type === 'line') return point((primitive.b.x - primitive.a.x) * direction, (primitive.b.y - primitive.a.y) * direction);
        const local = point(-primitive.rx * Math.sin(parameter) * direction, primitive.ry * Math.cos(parameter) * direction);
        return rotateVector(local, primitive.rotation);
      }

      function tangentAngle(primitive, parameter, direction) {
        const tangent = tangentVector(primitive, parameter, direction);
        return Math.atan2(-tangent.y, tangent.x);
      }

      function buildHalfEdges() {
        const primitives = primitivesForShapes();
        for (let i = 0; i < primitives.length; i += 1) {
          for (let j = i + 1; j < primitives.length; j += 1) {
            const first = primitives[i];
            const second = primitives[j];
            if (first.shapeId === second.shapeId) continue;
            let intersections;
            if (first.type === 'line' && second.type === 'line') {
              splitCollinearOverlap(first, second);
              intersections = lineLineIntersections(first, second);
            }
            else if (first.type === 'line' && second.type === 'ellipse') intersections = lineEllipseIntersections(first, second);
            else if (first.type === 'ellipse' && second.type === 'line') intersections = lineEllipseIntersections(second, first);
            else intersections = ellipseEllipseIntersections(first, second);
            intersections.forEach((intersection) => { addParam(first, intersection); addParam(second, intersection); });
          }
        }

        const nodes = new Map();
        const getNode = (p) => {
          const key = keyForPoint(p);
          if (!nodes.has(key)) nodes.set(key, { key, p });
          return nodes.get(key);
        };
        const edges = [];
        const outgoing = new Map();
        const seenBoundaryPieces = new Set();
        const register = (edge) => {
          edges.push(edge);
          if (!outgoing.has(edge.from.key)) outgoing.set(edge.from.key, []);
          outgoing.get(edge.from.key).push(edge);
        };
        const boundaryPieceKey = (primitive, from, to, start, end) => {
          const endpoints = [from.key, to.key].sort().join(':');
          if (primitive.type === 'line') return `line:${endpoints}`;
          const mid = pointAt(primitive, (start + end) / 2);
          return `arc:${fmt(primitive.c.x)},${fmt(primitive.c.y)},${fmt(primitive.rx)},${fmt(primitive.ry)},${fmt(primitive.rotation)}:${endpoints}:${keyForPoint(mid)}`;
        };
        primitives.forEach((primitive) => {
          const maximum = primitive.type === 'line' ? 1 : primitive.rangeEnd;
          const parameters = primitive.params
            .map((value) => primitive.type === 'ellipse' && Math.abs(value - maximum) < 1e-6 ? maximum : value)
            .sort((a, b) => a - b)
            .filter((value, index, values) => index === 0 || Math.abs(value - values[index - 1]) > 1e-6);
          for (let i = 0; i < parameters.length - 1; i += 1) {
            const start = parameters[i];
            const end = parameters[i + 1];
            if (end - start < EPS) continue;
            const from = getNode(pointAt(primitive, start));
            const to = getNode(pointAt(primitive, end));
            const pieceKey = boundaryPieceKey(primitive, from, to, start, end);
            if (seenBoundaryPieces.has(pieceKey)) continue;
            seenBoundaryPieces.add(pieceKey);
            const forward = { primitive, from, to, start, end, direction: 1, startAngle: tangentAngle(primitive, start, 1), twin: null, next: null };
            const reverse = { primitive, from: to, to: from, start: end, end: start, direction: -1, startAngle: tangentAngle(primitive, end, -1), twin: forward, next: null };
            forward.twin = reverse;
            register(forward);
            register(reverse);
          }
        });
        outgoing.forEach((list) => list.sort((a, b) => a.startAngle - b.startAngle));
        edges.forEach((edge) => {
          const atEnd = outgoing.get(edge.to.key);
          const reverseIndex = atEnd.indexOf(edge.twin);
          edge.next = atEnd[(reverseIndex - 1 + atEnd.length) % atEnd.length];
        });
        return edges;
      }

      function edgeSamples(edge) {
        const values = [];
        if (edge.primitive.type === 'line') return [edge.from.p, edge.to.p];
        const delta = edge.end - edge.start;
        const count = Math.max(1, Math.ceil(Math.abs(delta) / (Math.PI / 24)));
        for (let i = 0; i <= count; i += 1) values.push(pointAt(edge.primitive, edge.start + delta * i / count));
        return values;
      }

      function signedMathArea(edges) {
        const samples = [];
        edges.forEach((edge) => {
          edgeSamples(edge).forEach((p, index) => { if (samples.length === 0 || index > 0) samples.push(p); });
        });
        let area = 0;
        for (let i = 0; i < samples.length - 1; i += 1) area += samples[i].x * (-samples[i + 1].y) - samples[i + 1].x * (-samples[i].y);
        return area / 2;
      }

      function edgePath(edge) {
        if (edge.primitive.type === 'line') return `L ${pointText(edge.to.p)}`;
        const rx = fmt(edge.primitive.rx);
        const ry = fmt(edge.primitive.ry);
        const delta = edge.end - edge.start;
        const large = Math.abs(delta) > Math.PI + EPS ? 1 : 0;
        return `A ${rx} ${ry} ${fmt(edge.primitive.rotation * 180 / Math.PI)} ${large} ${delta > 0 ? 1 : 0} ${pointText(edge.to.p)}`;
      }

      function pathForCycle(cycle) {
        return `M ${pointText(cycle.edges[0].from.p)} ${cycle.edges.map(edgePath).join(' ')} Z`;
      }

      function leftProbe(edge) {
        let p;
        let dx;
        let dy;
        if (edge.primitive.type === 'line') {
          p = point((edge.from.p.x + edge.to.p.x) / 2, (edge.from.p.y + edge.to.p.y) / 2);
          dx = (edge.to.p.x - edge.from.p.x);
          dy = (edge.to.p.y - edge.from.p.y);
        } else {
          const theta = (edge.start + edge.end) / 2;
          p = pointAt(edge.primitive, theta);
          const tangent = tangentVector(edge.primitive, theta, edge.direction);
          dx = tangent.x;
          dy = tangent.y;
        }
        const length = Math.hypot(dx, dy) || 1;
        return point(p.x + dy / length * 0.75, p.y - dx / length * 0.75);
      }

      function containsPoint(shape, p) {
        if (shape.type === 'line') return false;
        const local = pointToLocal(shape, p);
        const frame = shapeFrame(shape);
        if (shape.type === 'square') return local.x > -frame.width / 2 + EPS && local.x < frame.width / 2 - EPS && local.y > -frame.height / 2 + EPS && local.y < frame.height / 2 - EPS;
        return local.x * local.x / (shape.rx * shape.rx) + local.y * local.y / (shape.ry * shape.ry) < 1 - EPS;
      }

      function signatureFor(p) { return shapes.map((shape) => containsPoint(shape, p) ? '1' : '0').join(''); }

      function cyclePolygon(cycle) {
        const result = [];
        cycle.edges.forEach((edge) => edgeSamples(edge).forEach((p, index) => { if (!result.length || index > 0) result.push(p); }));
        return result;
      }

      function pointInPolygon(p, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i, i += 1) {
          const a = polygon[i];
          const b = polygon[j];
          if ((a.y > p.y) !== (b.y > p.y) && p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x) inside = !inside;
        }
        return inside;
      }

      function pathKey(cycle) {
        return cycle.edges.map((edge) => {
          if (edge.primitive.type === 'line') return `L:${fmt(edge.from.p.x)},${fmt(edge.from.p.y)}>${fmt(edge.to.p.x)},${fmt(edge.to.p.y)}`;
          return `E:${fmt(edge.primitive.c.x)},${fmt(edge.primitive.c.y)},${fmt(edge.primitive.rx)},${fmt(edge.primitive.ry)},${fmt(edge.primitive.rotation)}:${fmt(edge.start)}>${fmt(edge.end)}`;
        }).join('|');
      }

      function calculateRegions() {
        const oldColors = new Map(regions.filter((region) => region.color).map((region) => [region.key, region.color]));
        const edges = buildHalfEdges();
        const visited = new Set();
        const cycles = [];
        edges.forEach((edge) => {
          if (visited.has(edge)) return;
          const cycleEdges = [];
          let current = edge;
          while (!visited.has(current)) {
            visited.add(current);
            cycleEdges.push(current);
            current = current.next;
          }
          if (current !== edge || !cycleEdges.length) return;
          const area = signedMathArea(cycleEdges);
          if (Math.abs(area) < 0.001) return;
          const cycle = { edges: cycleEdges, area, path: '', signature: '', probe: null, polygon: null, key: '' };
          cycle.path = pathForCycle(cycle);
          cycle.probe = leftProbe(cycleEdges[0]);
          cycle.signature = signatureFor(cycle.probe);
          cycle.polygon = cyclePolygon(cycle);
          cycle.key = pathKey(cycle);
          cycles.push(cycle);
        });
        const positive = cycles.filter((cycle) => cycle.area > 0);
        const negative = cycles.filter((cycle) => cycle.area < 0);
        const generated = positive.map((outer) => ({ outer, holes: [], signature: outer.signature }));
        negative.forEach((hole) => {
          const candidates = generated
            .filter((region) => region.signature === hole.signature && pointInPolygon(hole.probe, region.outer.polygon))
            .sort((a, b) => Math.abs(a.outer.area) - Math.abs(b.outer.area));
          if (candidates.length) candidates[0].holes.push(hole);
        });
        regions = generated.map((region) => {
          const orderedHoleKeys = region.holes.map((hole) => hole.key).sort();
          const key = `${region.outer.key}::${orderedHoleKeys.join('::')}`;
          return { key, d: [region.outer.path, ...region.holes.map((hole) => hole.path)].join(' '), color: oldColors.get(key) || null };
        });
        if (!regions.some((region) => region.key === selectedRegionKey)) selectedRegionKey = null;
        render();
      }

      function selectedShape() { return shapes.find((shape) => shape.id === selectedShapeId) || null; }

      function updatePropertiesPanel() {
        const isDraft = Boolean(draftShape);
        const shape = draftShape || selectedShape();
        propertiesPanel.hidden = !shape;
        if (!shape) return;
        const isLine = shape.type === 'line';
        if (isLine) {
          shapeXLabel.textContent = 'A X';
          shapeYLabel.textContent = 'A Y';
          shapeWidthLabel.textContent = 'B X';
          shapeHeightLabel.textContent = 'B Y';
          shapeXInput.value = integerText(shape.ax);
          shapeYInput.value = integerText(shape.ay);
          shapeWidthInput.value = integerText(shape.bx);
          shapeHeightInput.value = integerText(shape.by);
          lineAngleInput.value = fmt(lineAngle(shape));
          shapeXInput.setAttribute('aria-label', '起点 X 坐标');
          shapeYInput.setAttribute('aria-label', '起点 Y 坐标');
          shapeWidthInput.setAttribute('aria-label', '终点 X 坐标');
          shapeHeightInput.setAttribute('aria-label', '终点 Y 坐标');
        } else {
          const frame = shapeFrame(shape);
          shapeXLabel.textContent = 'X';
          shapeYLabel.textContent = 'Y';
          shapeWidthLabel.textContent = 'W';
          shapeHeightLabel.textContent = 'H';
          shapeXInput.value = integerText(frame.left);
          shapeYInput.value = integerText(frame.top);
          shapeWidthInput.value = integerText(frame.width);
          shapeHeightInput.value = integerText(frame.height);
          lineAngleInput.value = fmt(rotationOf(shape));
          shapeXInput.setAttribute('aria-label', '左上角 X 坐标');
          shapeYInput.setAttribute('aria-label', '左上角 Y 坐标');
          shapeWidthInput.setAttribute('aria-label', '宽度');
          shapeHeightInput.setAttribute('aria-label', '高度');
        }
        [shapeXInput, shapeYInput, shapeWidthInput, shapeHeightInput, lineAngleInput].forEach((control) => { control.disabled = isDraft; });
        lineAngleRow.hidden = false;
        aspectToggle.hidden = isLine;
        aspectToggle.disabled = isDraft || isLine;
        copyShapeButton.disabled = isDraft || !selectedShape();
        aspectToggle.setAttribute('aria-pressed', String(shape.aspectLocked !== false));
        removeShapeButton.disabled = isDraft || !selectedShape();
      }

      function applyShapeGeometry(element, shape) {
        element.removeAttribute('transform');
        if (shape.type === 'line') {
          element.setAttribute('x1', shape.ax);
          element.setAttribute('y1', shape.ay);
          element.setAttribute('x2', shape.bx);
          element.setAttribute('y2', shape.by);
        } else if (shape.type === 'square') {
          element.setAttribute('x', shape.x);
          element.setAttribute('y', shape.y);
          element.setAttribute('width', shape.width);
          element.setAttribute('height', shape.height);
          const frame = shapeFrame(shape);
          element.setAttribute('transform', `rotate(${fmt(rotationOf(shape))} ${fmt(frame.cx)} ${fmt(frame.cy)})`);
        } else {
          element.setAttribute('cx', shape.cx);
          element.setAttribute('cy', shape.cy);
          element.setAttribute('rx', shape.rx);
          element.setAttribute('ry', shape.ry);
          element.setAttribute('transform', `rotate(${fmt(rotationOf(shape))} ${fmt(shape.cx)} ${fmt(shape.cy)})`);
        }
      }

      function updateLineHandles() {
        const shape = selectedShape();
        const showLineHandles = shape && shape.type === 'line';
        const showShapeHandles = shape && shape.type !== 'line';
        setOverlayVisibility(lineStartHandle, showLineHandles);
        setOverlayVisibility(lineEndHandle, showLineHandles);
        setOverlayVisibility(shapeRotateHandle, showShapeHandles);
        setOverlayVisibility(shapeResizeHandle, showShapeHandles);
        if (showLineHandles) {
          lineStartHandle.setAttribute('cx', shape.ax);
          lineStartHandle.setAttribute('cy', shape.ay);
          lineEndHandle.setAttribute('cx', shape.bx);
          lineEndHandle.setAttribute('cy', shape.by);
        }
        if (showShapeHandles) {
          const frame = shapeFrame(shape);
          const resizePoint = pointFromLocal(shape, point(frame.width / 2, frame.height / 2));
          const rotatePoint = pointFromLocal(shape, point(frame.width / 2, -frame.height / 2));
          shapeResizeHandle.setAttribute('cx', resizePoint.x);
          shapeResizeHandle.setAttribute('cy', resizePoint.y);
          shapeRotateHandle.setAttribute('cx', rotatePoint.x);
          shapeRotateHandle.setAttribute('cy', rotatePoint.y);
        }
      }

      function renderShapes() {
        if (!shapes.some((shape) => shape.id === selectedShapeId)) selectedShapeId = null;
        shapeLayer.replaceChildren();
        shapes.forEach((shape) => {
          const elementName = shape.type === 'line' ? 'line' : (shape.type === 'square' ? 'rect' : 'ellipse');
          const element = createSvg(elementName);
          element.classList.add('shape');
          if (shape.type === 'line') element.classList.add('line-shape');
          if (shape.id === selectedShapeId) element.classList.add('selected-shape');
          applyShapeGeometry(element, shape);
          shapeLayer.append(element);
        });
        shapeLayer.style.visibility = hideBaseShapeOutlines ? 'hidden' : 'visible';
        updateLineHandles();
        deleteShapeButton.disabled = selectedShapeId === null;
        updatePropertiesPanel();
      }

      function renderRegions() {
        regionLayer.replaceChildren();
        regions.forEach((region) => {
          const element = createSvg('path');
          const isHiddenDuringMove = hideColoredRegions && Boolean(region.color);
          const fill = isHiddenDuringMove ? 'transparent' : (region.color || 'transparent');
          const coverSeam = hideBaseShapeOutlines && Boolean(region.color) && !isHiddenDuringMove;
          element.setAttribute('d', region.d);
          element.setAttribute('fill-rule', 'evenodd');
          element.setAttribute('data-region-key', region.key);
          element.setAttribute('fill', fill);
          if (coverSeam) {
            element.setAttribute('stroke', region.color);
            element.setAttribute('stroke-width', '1');
            element.setAttribute('vector-effect', 'non-scaling-stroke');
            element.setAttribute('paint-order', 'stroke fill');
          }
          element.style.pointerEvents = isHiddenDuringMove ? 'none' : 'all';
          element.style.visibility = isHiddenDuringMove ? 'hidden' : 'visible';
          regionLayer.append(element);
        });
      }

      function renderRecentColors() {
        const hasSelection = selectedRegionKey !== null;
        recentColorsContainer.replaceChildren();
        recentColors.forEach((color) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'recent-color';
          button.disabled = !hasSelection;
          button.setAttribute('aria-label', `使用颜色 ${color.toUpperCase()}`);
          button.setAttribute('data-color', color);
          button.style.background = color;
          button.addEventListener('click', () => changeSelectedColor(color));
          recentColorsContainer.append(button);
        });
      }

      function rememberRecentColor(color) {
        const normalized = color.toLowerCase();
        if (recentColors.includes(normalized)) return;
        recentColors = [normalized, ...recentColors].slice(0, 3);
      }

      function rememberPickerColor(color) {
        const normalized = color.toLowerCase();
        if (!colorPickerSessionOpen) {
          colorPickerSessionOpen = true;
          colorPickerSessionChanged = false;
          colorPickerSessionStartColor = null;
        }
        if (!colorPickerSessionChanged) {
          if (colorPickerSessionStartColor && normalized === colorPickerSessionStartColor) return;
          recentColors = [normalized, recentColors[0], recentColors[1]];
          colorPickerSessionChanged = true;
        } else recentColors[0] = normalized;
      }

      function closeColorPickerSession() {
        colorPickerSessionOpen = false;
        colorPickerSessionChanged = false;
        colorPickerSessionStartColor = null;
      }

      function updateSelectionUI() {
        const selected = regions.find((region) => region.key === selectedRegionKey);
        colorValue.textContent = selected && selected.color ? selected.color.toUpperCase() : '透明';
        if (selected) {
          showSelection();
          selection.setAttribute('d', selected.d);
          selection.setAttribute('fill-rule', 'evenodd');
          colorPicker.disabled = false;
          clearColorButton.disabled = false;
          if (selected.color) colorPicker.value = selected.color;
        } else {
          hideSelection();
          colorPicker.disabled = true;
          clearColorButton.disabled = true;
        }
        renderRecentColors();
      }

      function render() { renderRegions(); renderShapes(); updateSelectionUI(); }

      function clearSelection() { selectedRegionKey = null; updateSelectionUI(); }

      function selectRegion(key) { selectedRegionKey = key; updateSelectionUI(); }

      function selectShape(shapeId) {
        selectedShapeId = shapeId;
        renderShapes();
      }

      function clearShapeSelection() {
        if (selectedShapeId === null) return;
        selectedShapeId = null;
        renderShapes();
      }

      function deleteSelectedShape() {
        const index = shapes.findIndex((shape) => shape.id === selectedShapeId);
        if (index < 0) { clearShapeSelection(); return; }
        shapes.splice(index, 1);
        selectedShapeId = null;
        clearSelection();
        calculateRegions();
      }

      function changeSelectedColor(color, recentSource = 'standard') {
        const selected = regions.find((region) => region.key === selectedRegionKey);
        if (!selected) return;
        selected.color = color;
        if (color && recentSource === 'picker') rememberPickerColor(color);
        else if (color && recentSource === 'standard') rememberRecentColor(color);
        render();
      }

      function updateSelectedShapeFromProperty(property, value) {
        const shape = selectedShape();
        const number = Number(value);
        if (!shape || !Number.isFinite(number)) return;
        if (shape.type === 'line') {
          const coordinate = integer(number);
          if (property === 'x') shape.ax = clamp(coordinate, 0, WIDTH);
          if (property === 'y') shape.ay = clamp(coordinate, 0, HEIGHT);
          if (property === 'width') shape.bx = clamp(coordinate, 0, WIDTH);
          if (property === 'height') shape.by = clamp(coordinate, 0, HEIGHT);
          if (property === 'angle') {
            const length = Math.hypot(shape.bx - shape.ax, shape.by - shape.ay);
            if (length > EPS) {
              const radians = normalizeAngle(number) * Math.PI / 180;
              shape.bx = integer(shape.ax + length * Math.cos(radians));
              shape.by = integer(shape.ay + length * Math.sin(radians));
            }
          }
          calculateRegions();
          return;
        }
        const frame = shapeFrame(shape);
        const next = { left: frame.left, top: frame.top, width: frame.width, height: frame.height };
        if (property === 'angle') {
          shape.rotation = normalizeAngle(number);
          calculateRegions();
          return;
        }
        if (property === 'x') next.left = number;
        if (property === 'y') next.top = number;
        if (property === 'width') next.width = number;
        if (property === 'height') next.height = number;
        setShapeBounds(shape, next, property === 'width' || property === 'height' ? property : null);
        calculateRegions();
      }

      shapeXInput.addEventListener('input', () => updateSelectedShapeFromProperty('x', shapeXInput.value));
      shapeYInput.addEventListener('input', () => updateSelectedShapeFromProperty('y', shapeYInput.value));
      shapeWidthInput.addEventListener('input', () => updateSelectedShapeFromProperty('width', shapeWidthInput.value));
      shapeHeightInput.addEventListener('input', () => updateSelectedShapeFromProperty('height', shapeHeightInput.value));
      lineAngleInput.addEventListener('input', () => updateSelectedShapeFromProperty('angle', lineAngleInput.value));
      aspectToggle.addEventListener('click', () => {
        const shape = selectedShape();
        if (!shape) return;
        shape.aspectLocked = shape.aspectLocked === false;
        updatePropertiesPanel();
      });

      colorPicker.addEventListener('pointerdown', () => {
        colorPickerSessionOpen = true;
        colorPickerSessionChanged = false;
        colorPickerSessionStartColor = colorPicker.value.toLowerCase();
        const selected = regions.find((region) => region.key === selectedRegionKey);
        if (selected && !selected.color) changeSelectedColor(colorPicker.value, 'none');
      });
      colorPicker.addEventListener('input', () => changeSelectedColor(colorPicker.value, 'picker'));
      colorPicker.addEventListener('change', closeColorPickerSession);
      colorPicker.addEventListener('blur', closeColorPickerSession);
      clearColorButton.addEventListener('click', () => changeSelectedColor(null));
      deleteShapeButton.addEventListener('click', deleteSelectedShape);
      copyShapeButton.addEventListener('click', duplicateSelectedShape);
      removeShapeButton.addEventListener('click', deleteSelectedShape);

      function isEditableTarget(target) {
        return target instanceof Element && Boolean(target.closest('input, textarea, [contenteditable="true"]'));
      }

      function handleCopyPasteShortcut(event) {
        if (isEditableTarget(event.target) || !event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
        const key = event.key.toLowerCase();
        if (key === 'c' && copySelectedShapeToBuffer()) event.preventDefault();
        if (key === 'v' && pasteCopiedShape()) event.preventDefault();
      }

      board.addEventListener('keydown', handleCopyPasteShortcut);
      propertiesPanel.addEventListener('keydown', handleCopyPasteShortcut);

      board.addEventListener('pointerdown', (event) => {
        board.focus({ preventScroll: true });
        if (event.button !== 0) return;
        const p = pointerPosition(event);
        board.setPointerCapture(event.pointerId);
        const rotateTarget = event.target.closest ? event.target.closest('[data-shape-rotate]') : null;
        const selectedShapeForRotate = selectedShape();
        if (rotateTarget && selectedShapeForRotate && selectedShapeForRotate.type !== 'line') {
          const frame = shapeFrame(selectedShapeForRotate);
          pointerAction = { kind: 'shape-rotate', pointerId: event.pointerId, shapeId: selectedShapeForRotate.id, initialRotation: rotationOf(selectedShapeForRotate), startAngle: Math.atan2(p.y - frame.cy, p.x - frame.cx) };
          clearSelection();
          hideColoredRegions = true;
          renderRegions();
          updateBoardCursor();
          event.preventDefault();
          return;
        }
        const resizeTarget = event.target.closest ? event.target.closest('[data-shape-resize]') : null;
        const selectedShapeForResize = selectedShape();
        if (resizeTarget && selectedShapeForResize && selectedShapeForResize.type !== 'line') {
          pointerAction = { kind: 'shape-resize', pointerId: event.pointerId, shapeId: selectedShapeForResize.id };
          clearSelection();
          hideColoredRegions = true;
          renderRegions();
          updateBoardCursor();
          event.preventDefault();
          return;
        }
        const handleTarget = event.target.closest ? event.target.closest('[data-line-handle]') : null;
        const selectedLine = selectedShape();
        if (handleTarget && selectedLine && selectedLine.type === 'line') {
          pointerAction = { kind: 'line-endpoint', pointerId: event.pointerId, shapeId: selectedLine.id, endpoint: handleTarget.dataset.lineHandle };
          clearSelection();
          hideColoredRegions = true;
          renderRegions();
          updateBoardCursor();
          event.preventDefault();
          return;
        }
        const hit = closestBorderShape(p);
        if (mode !== 'select' && hit) setMode('select');
        if (mode !== 'select') {
          clearShapeSelection();
          hidePreview();
          draftShape = mode === 'line'
            ? { type: mode, ax: p.x, ay: p.y, bx: p.x, by: p.y }
            : (mode === 'square'
              ? { type: mode, x: p.x, y: p.y, width: 0, height: 0, rotation: 0, aspectLocked: true }
              : { type: mode, cx: p.x, cy: p.y, rx: 0, ry: 0, rotation: 0, aspectLocked: true });
          pointerAction = { kind: 'create', start: p, pointerId: event.pointerId };
          updatePropertiesPanel();
          previewDrag(p, p);
          event.preventDefault();
          return;
        }
        if (hit) {
          hidePreview();
          selectShape(hit.shape.id);
          pointerAction = { kind: 'move', pointerId: event.pointerId, shapeId: hit.shape.id, initialShape: copyShape(hit.shape), start: p };
          clearSelection();
          hideColoredRegions = true;
          renderRegions();
          updateBoardCursor();
          event.preventDefault();
          return;
        }
        clearShapeSelection();
        const regionTarget = event.target.closest ? event.target.closest('[data-region-key]') : null;
        if (regionTarget) selectRegion(regionTarget.dataset.regionKey);
        else clearSelection();
      });

      board.addEventListener('pointermove', (event) => {
        if (!pointerAction || pointerAction.pointerId !== event.pointerId) {
          if (mode === 'select') board.style.cursor = closestBorderShape(pointerPosition(event)) ? 'grab' : 'default';
          return;
        }
        const p = pointerPosition(event);
        if (pointerAction.kind === 'create') previewDrag(pointerAction.start, p);
        else {
          const shape = shapes.find((item) => item.id === pointerAction.shapeId);
          if (!shape) return;
          if (pointerAction.kind === 'shape-rotate') {
            const frame = shapeFrame(shape);
            let degrees = pointerAction.initialRotation + (Math.atan2(p.y - frame.cy, p.x - frame.cx) - pointerAction.startAngle) * 180 / Math.PI;
            if (event.shiftKey) degrees = Math.round(degrees / 15) * 15;
            shape.rotation = normalizeAngle(degrees);
            renderShapes();
            return;
          }
          if (pointerAction.kind === 'shape-resize') {
            const frame = shapeFrame(shape);
            const anchor = pointFromLocal(shape, point(-frame.width / 2, -frame.height / 2));
            const local = rotateVector(point(p.x - anchor.x, p.y - anchor.y), -rotationRadians(shape));
            const width = Math.max(3, local.x);
            const height = Math.max(3, local.y);
            const next = { left: frame.left, top: frame.top, width, height };
            if (shape.aspectLocked !== false) {
              const scaleWidth = width / frame.width;
              const scaleHeight = height / frame.height;
              setShapeBounds(shape, next, scaleWidth >= scaleHeight ? 'width' : 'height');
            } else setShapeBounds(shape, next);
            renderShapes();
            return;
          }
          if (pointerAction.kind === 'line-endpoint') {
            if (pointerAction.endpoint === 'a') { shape.ax = p.x; shape.ay = p.y; }
            else { shape.bx = p.x; shape.by = p.y; }
            clampShapeToBoard(shape);
            renderShapes();
            return;
          }
          const dx = p.x - pointerAction.start.x;
          const dy = p.y - pointerAction.start.y;
          Object.assign(shape, pointerAction.initialShape);
          if (shape.type === 'line') {
            shape.ax += dx; shape.ay += dy; shape.bx += dx; shape.by += dy;
          } else if (shape.type === 'square') { shape.x += dx; shape.y += dy; }
          else { shape.cx += dx; shape.cy += dy; }
          clampShapeToBoard(shape);
          renderShapes();
        }
      });

      function finishPointerAction(event) {
        if (!pointerAction || pointerAction.pointerId !== event.pointerId) return;
        const p = pointerPosition(event);
        hidePreview();
        if (pointerAction.kind === 'create') {
          const draft = makeShapeFromDrag(mode, pointerAction.start, p);
          draftShape = null;
          if (draft) {
            shapes.push(draft);
            selectedShapeId = draft.id;
            nextShapeId += 1;
            calculateRegions();
          } else updatePropertiesPanel();
        } else if (pointerAction.kind === 'move' || pointerAction.kind === 'line-endpoint' || pointerAction.kind === 'shape-resize' || pointerAction.kind === 'shape-rotate') {
          hideColoredRegions = false;
          calculateRegions();
        }
        pointerAction = null;
        updateBoardCursor();
        if (board.hasPointerCapture(event.pointerId)) board.releasePointerCapture(event.pointerId);
      }
      board.addEventListener('pointerup', finishPointerAction);
      board.addEventListener('pointercancel', finishPointerAction);

      previewButton.addEventListener('click', () => {
        hideBaseShapeOutlines = !hideBaseShapeOutlines;
        previewButton.setAttribute('aria-pressed', String(hideBaseShapeOutlines));
        previewButton.textContent = hideBaseShapeOutlines ? '退出预览' : '预览';
        shapeLayer.style.visibility = hideBaseShapeOutlines ? 'hidden' : 'visible';
        renderRegions();
      });

      exportButton.addEventListener('click', () => {
        const colored = regions.filter((region) => region.color);
        const svg = [
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${WIDTH} ${HEIGHT}" width="${WIDTH}" height="${HEIGHT}">`,
          ...colored.map((region) => `<path d="${region.d}" fill="${region.color}" fill-rule="evenodd"/>`),
          '</svg>'
        ].join('\n');
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'cross-draw-colored-regions.svg';
        link.click();
        URL.revokeObjectURL(url);
      });

      calculateRegions();
    })();
  </script>
</body>
</html>
